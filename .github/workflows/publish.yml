name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  version-check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json says $PKG_VERSION but tag is $TAG_VERSION — bump package.json to match"
            exit 1
          fi
          echo "versions match: $PKG_VERSION"

  publish:
    runs-on: ubuntu-latest
    needs: [version-check]
    if: always() && (needs.version-check.result == 'success' || needs.version-check.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            MAJOR_MINOR="${V%.*}"
            {
              echo "tags<<EOF"
              echo "formatho/formatho-runtime:${V}"
              echo "formatho/formatho-runtime:${MAJOR_MINOR}"
              echo "formatho/formatho-runtime:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "formatho/formatho-runtime:edge"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
